<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>温湿度监控</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<script src="/static/chart.umd.min.js"></script>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; max-width: 1100px; margin: 24px auto; padding: 0 16px; }
  h1, h2 { font-size: 1.25rem; margin: 16px 0 8px; }
  p, figure { margin: 8px 0 16px; }
  small { color: #555; }
  #latest strong { font-size: 1.5rem; }
  button { font: inherit; margin: 0 4px 8px 0; padding: 4px 10px; cursor: pointer; }
  button[aria-pressed="true"] { background: #333; color: #fff; }
  button:disabled { opacity: 0.5; cursor: wait; }
  #chart-wrap { position: relative; height: clamp(280px, 55vh, 420px); }
</style>
</head>
<body>
  <header><h1>温湿度监控</h1></header>
  <main>
    <section aria-labelledby="latest-heading">
        <h2 id="latest-heading">最新读数</h2>
        <p id="latest">
          温度 <strong id="latest-temperature">— °C</strong> ·
          湿度 <strong id="latest-humidity">— %</strong><br>
          <small id="latest-status" role="status">加载中…</small>
        </p>
    </section>
    <section aria-labelledby="history-heading">
      <h2 id="history-heading">历史趋势 · <span id="current-range">24 小时</span></h2>
      <div id="range-buttons" role="group" aria-label="历史时间范围">
        <button data-range="1h" aria-pressed="false">1 小时</button>
        <button data-range="24h" aria-pressed="true">24 小时</button>
        <button data-range="7d" aria-pressed="false">7 天</button>
        <button data-range="30d" aria-pressed="false">30 天</button>
        <button data-range="1y" aria-pressed="false">1 年</button>
        <button data-range="3y" aria-pressed="false">3 年</button>
        <button data-range="5y" aria-pressed="false">5 年</button>
        <button data-range="all" aria-pressed="false">全部</button>
      </div>
      <p id="chart-status" role="status" aria-live="polite" hidden></p>
      <figure>
        <div id="chart-wrap"><canvas id="chart" role="img" aria-label="温度与湿度历史曲线"></canvas></div>
        <figcaption><small id="chart-period">选择时间范围查看历史，轻触或悬停曲线查看完整时间和读数。</small></figcaption>
      </figure>
    </section>
  </main>
  <script src="/static/app.js?v=20261030-2"></script>
</body>
</html>
